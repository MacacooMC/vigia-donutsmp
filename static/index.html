<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía DonutSMP</title>
<link rel="icon" id="favicon">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#120c18; --card:#1c1424cc; --card-solid:#1c1424; --line:#33263f; --line2:#4a3658;
    --text:#fbf3ff; --muted:#b4a3c4; --pink:#ff6fb5; --pink2:#ffb3dc; --lav:#c9a7ff; --lav2:#e6d6ff;
    --green:#7ef0b0; --red:#ff6b8b; --amber:#ffd36b;
    --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
    --stripes:repeating-linear-gradient(90deg, var(--pink) 0 10px, #fff 10px 20px);
  }
  * { box-sizing:border-box }
  html { scroll-behavior:smooth }
  body { margin:0; color:var(--text); font:15px/1.5 Inter,system-ui,sans-serif; overflow-x:hidden; background:var(--bg) }
  .sky { position:fixed; inset:0; pointer-events:none; z-index:0;
         background:radial-gradient(800px 500px at 90% -10%, #ff6fb540, transparent 60%),
                    radial-gradient(700px 500px at -10% 40%, #c9a7ff2a, transparent 60%),
                    radial-gradient(600px 400px at 60% 120%, #ff6fb522, transparent 60%) }
  .sky::after { content:""; position:absolute; inset:0; opacity:.5;
                background-image:radial-gradient(#ffffff14 1px, transparent 1px); background-size:22px 22px }
  .floaty { position:fixed; pointer-events:none; z-index:0; color:var(--pink); opacity:.0; font-size:14px;
            animation:rise linear forwards }
  @keyframes rise { 0% { transform:translateY(0) rotate(0); opacity:0 } 10% { opacity:.55 } 100% { transform:translateY(-110vh) rotate(40deg); opacity:0 } }

  .wrap { position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:18px 16px 80px }
  h1,h2,.pix { font-family:Silkscreen,monospace }

  /* ---------- cabecera ---------- */
  header { display:flex; align-items:center; gap:16px; padding:16px 0 4px; position:relative; min-height:184px }
  .logo { width:66px; height:66px; flex:none; filter:drop-shadow(0 4px 0 #0007); animation:spin-in .9s var(--spring) both }
  .logo:hover { animation:wobble .6s var(--ease) }
  @keyframes spin-in { from { transform:rotate(-200deg) scale(0) } }
  @keyframes wobble { 30% { transform:rotate(-14deg) scale(1.08) } 60% { transform:rotate(10deg) } }
  .title { animation:drop .7s .1s var(--ease) both }
  h1 { font-size:31px; line-height:1; margin:0; color:var(--pink); text-shadow:3px 3px 0 #6b1f48 }
  h1 span { color:var(--text); text-shadow:3px 3px 0 #2b1d38 }
  h1 .heart { color:var(--pink2); display:inline-block; animation:beat 1.4s ease-in-out infinite; text-shadow:none }
  @keyframes beat { 15%,45% { transform:scale(1.25) } 30% { transform:scale(.95) } }
  .tag { color:var(--muted); font-size:13px; margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center }
  .ver { font-family:Silkscreen,monospace; font-size:11px; background:var(--line); padding:1px 7px; border-radius:6px }
  .bell { font:700 11px Silkscreen,monospace; color:var(--text); background:#ffffff10; border:1.5px solid var(--line2);
          border-radius:99px; padding:4px 11px; cursor:pointer; transition:all .25s var(--ease) }
  .bell:hover { border-color:var(--pink); transform:translateY(-1px) }
  .bell.on { background:linear-gradient(90deg,var(--pink),var(--lav)); color:#2a1030; border-color:transparent }
  @keyframes drop { from { opacity:0; transform:translateY(-18px) } }

  .mascot { position:absolute; right:4px; top:6px; display:flex; align-items:flex-start; gap:8px; animation:drop .8s .25s var(--ease) both }
  .mascot img { width:74px; height:auto; image-rendering:pixelated; cursor:pointer; transform-origin:50% 100%;
                animation:bob 2.6s ease-in-out infinite; filter:drop-shadow(0 0 6px #ff6fb5aa) drop-shadow(0 7px 0 #0006) }
  .mascot img.jump { animation:jump .9s var(--spring) }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(1.5deg) } }
  @keyframes jump { 0% { transform:scale(1,1) } 20% { transform:scale(1.15,.85) } 45% { transform:translateY(-34px) scale(.9,1.1) rotate(-8deg) } 70% { transform:translateY(0) scale(1.1,.9) } }
  .bubble { margin-top:20px; background:#fff; color:#2a1030; font:700 12px Silkscreen,monospace; padding:9px 12px;
            border-radius:12px 12px 4px 12px; position:relative; max-width:170px; box-shadow:4px 4px 0 var(--pink); transition:transform .3s var(--spring) }
  .bubble.pop { animation:pop .45s var(--spring) }
  @keyframes pop { 0% { transform:scale(.6) rotate(-6deg) } 100% { transform:scale(1) } }
  .bubble::after { content:""; position:absolute; right:-9px; top:14px; border:6px solid transparent; border-left:9px solid #fff }
  .socks { height:6px; border-radius:6px; background:var(--stripes); opacity:.75; margin-top:4px;
           mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent); animation:slide-stripes 3s linear infinite; background-size:40px 6px }
  @keyframes slide-stripes { to { background-position:40px 0 } }

  /* ---------- tarjetas de datos ---------- */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px }
  .stat { background:var(--card); backdrop-filter:blur(8px); border:1.5px solid var(--line); border-radius:14px; padding:13px 15px;
          box-shadow:0 6px 0 #0005; animation:rise-in .6s var(--ease) both; position:relative; overflow:hidden; transition:transform .3s var(--ease), border-color .3s }
  .stat:hover { transform:translateY(-3px); border-color:var(--line2) }
  .stat::before { content:""; position:absolute; inset:0 0 auto; height:3px; background:linear-gradient(90deg,var(--pink),var(--lav)); opacity:.8 }
  .stat .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; display:flex; gap:6px; align-items:center }
  .stat .v { font:800 27px Inter,sans-serif; margin-top:2px; font-variant-numeric:tabular-nums }
  .stat small { font-size:13px; color:var(--muted); font-weight:600 }
  .bar { height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:7px }
  .bar i { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--pink),var(--lav)); transition:width .9s var(--ease) }
  .dots { display:flex; gap:4px; margin-top:8px } .dots i { width:9px; height:9px; border-radius:50%; background:var(--line2); transition:background .3s }
  .dots i.ok { background:var(--green); box-shadow:0 0 8px var(--green) }
  @keyframes rise-in { from { opacity:0; transform:translateY(16px) scale(.98) } }

  .warn { background:#3b2a0bcc; border:1.5px solid var(--amber); color:var(--amber); padding:10px 14px; border-radius:12px; margin-top:16px; font-size:14px; animation:rise-in .5s var(--ease) }
  h2 { font-size:15px; margin:36px 0 14px; color:var(--pink2); display:flex; align-items:center; gap:10px }
  h2::before { content:"♡"; color:var(--pink); font-family:Inter }
  h2::after { content:""; flex:1; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--line2),transparent) }
  h2 .count { font:700 11px Inter; background:var(--line); color:var(--muted); padding:1px 8px; border-radius:99px }

  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)) }
  .one { grid-template-columns:1fr }
  .card { background:var(--card); backdrop-filter:blur(8px); border:1.5px solid var(--line); border-radius:16px; overflow:hidden;
          box-shadow:0 7px 0 #0006; transition:transform .35s var(--ease), border-color .35s, box-shadow .35s }
  .card:hover { transform:translateY(-4px); border-color:var(--pink); box-shadow:0 11px 0 #0006, 0 0 0 4px #ff6fb522 }
  .enter { animation:rise-in .55s var(--ease) both }
  .leave { animation:out .3s var(--ease) forwards }
  @keyframes out { to { opacity:0; transform:scale(.94) translateY(8px) } }

  .shot { aspect-ratio:16/9; background:#0b0710; position:relative; overflow:hidden; display:grid; place-items:center }
  .shot img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s ease, transform .6s var(--ease) }
  .shot img.show { opacity:1 }
  .card:hover .shot img.show { transform:scale(1.04) }
  .shot .off { font-family:Silkscreen,monospace; color:var(--muted); text-align:center; font-size:13px }
  .shot .off b { display:block; font-size:24px; color:var(--lav); animation:bob 2.6s ease-in-out infinite }
  .shot .badge { position:absolute; top:10px; left:10px; z-index:2 }
  .scan { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0;
          background:linear-gradient(180deg, transparent 0%, #ff6fb555 50%, transparent 100%); background-size:100% 40%; background-repeat:no-repeat }
  .scan.go { animation:scan 1.1s var(--ease) }
  @keyframes scan { 0% { opacity:1; background-position:0 -40% } 100% { opacity:1; background-position:0 140% } }
  .body { padding:13px 15px }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
  .name { font-weight:800; color:var(--text); text-decoration:none; transition:color .2s } .name:hover { color:var(--pink2) }
  .pill { font-size:12px; padding:2px 9px; border-radius:99px; background:var(--line); color:var(--muted); white-space:nowrap; transition:all .3s }
  .pill.live { background:#ff3d7f; color:#fff; font:700 11px Silkscreen,monospace; display:inline-flex; align-items:center; gap:6px; box-shadow:0 0 14px #ff3d7f99 }
  .pill.live::before { content:""; width:7px; height:7px; background:#fff; border-radius:50%; animation:blink 1.1s infinite }
  .pill.err { background:#4a1726; color:var(--red) }
  @keyframes blink { 50% { opacity:.15 } }
  .items { font-size:13px; color:var(--muted); margin-top:6px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 }
  .chip { background:linear-gradient(135deg,#ffe08a,#ffb86b); color:#3a2300; font-weight:800; font-size:13px; padding:3px 10px; border-radius:99px;
          box-shadow:0 3px 0 #9a5a1a; animation:chip .5s var(--spring) both }
  .chip small { font-weight:700; opacity:.7 }
  @keyframes chip { from { opacity:0; transform:scale(.3) rotate(-10deg) } }
  .x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px; transition:color .2s } .x:hover { color:var(--red) }

  .alert { display:grid; grid-template-columns:240px 1fr; gap:16px; padding:13px; position:relative }
  .alert::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--stripes); background-size:6px 20px;
                   background-image:repeating-linear-gradient(180deg,var(--pink) 0 10px,#fff 10px 20px) }
  .alert.enter { animation:slide-in .7s var(--spring) both }
  .alert.fresh { animation:slide-in .7s var(--spring) both, glow 1.4s .7s ease-in-out 3 }
  @keyframes slide-in { from { opacity:0; transform:translateX(-60px) scale(.96) } }
  @keyframes glow { 50% { box-shadow:0 0 0 4px #ff6fb5aa, 0 0 40px #ff6fb566 } }
  .alert img { width:100%; border-radius:10px; display:block; cursor:zoom-in; transition:transform .35s var(--ease) }
  .alert img:hover { transform:scale(1.03) }
  .ago { font:700 11px Silkscreen,monospace; color:var(--pink2) }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }

  /* ---------- secciones plegables ---------- */
  .fold { margin-top:22px; background:var(--card); backdrop-filter:blur(8px); border:1.5px solid var(--line); border-radius:16px; overflow:hidden }
  .fold > button { all:unset; box-sizing:border-box; width:100%; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
                   font:700 14px Silkscreen,monospace; color:var(--pink2); transition:background .2s }
  .fold > button:hover { background:#ffffff08 }
  .fold > button .arrow { transition:transform .4s var(--spring); display:inline-block }
  .fold.open > button .arrow { transform:rotate(90deg) }
  .fold .content { display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s var(--ease) }
  .fold.open .content { grid-template-rows:1fr }
  .fold .content > div { overflow:hidden }
  .fold .inner { padding:0 16px 16px }

  .admin { display:grid; gap:12px }
  input, textarea { width:100%; background:#0e0913; color:var(--text); border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; transition:border-color .2s, box-shadow .2s }
  input:focus, textarea:focus { outline:none; border-color:var(--pink); box-shadow:0 0 0 4px #ff6fb522 }
  button.btn { background:linear-gradient(135deg,var(--pink),#ff8fc7); color:#2a1030; border:0; border-radius:12px; padding:10px 16px;
               font:700 12px Silkscreen,monospace; cursor:pointer; box-shadow:0 4px 0 #a3255f; white-space:nowrap; transition:transform .15s, box-shadow .15s, filter .2s }
  button.btn:hover { filter:brightness(1.08); transform:translateY(-1px) }
  button.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #a3255f }
  button.btn.ghost { background:#ffffff0d; color:var(--text); box-shadow:0 4px 0 #0007; border:1.5px solid var(--line2) }
  .msg { font-size:13px; color:var(--pink2); min-height:1.2em }
  .empty { color:var(--muted); padding:26px; text-align:center; background:var(--card); border:1.5px dashed var(--line2); border-radius:16px }
  .empty b { display:block; font:700 22px Silkscreen,monospace; color:var(--lav); margin-bottom:4px }

  .vote { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px }
  .vote span { font-size:12px; padding:2px 9px; border-radius:99px; background:var(--line); color:var(--muted) }
  .vote span.yes { background:#16392a; color:var(--green) } .vote span.err { background:#4a1726; color:var(--red) }

  /* ---------- avisos emergentes ---------- */
  .toasts { position:fixed; right:16px; bottom:16px; z-index:50; display:flex; flex-direction:column; gap:10px; width:min(360px, calc(100vw - 32px)) }
  .toast { background:#fff; color:#2a1030; border-radius:16px; padding:12px 14px 14px; box-shadow:0 12px 30px #0008, 5px 5px 0 var(--pink);
           cursor:pointer; position:relative; overflow:hidden; animation:toast-in .6s var(--spring) both }
  .toast.bye { animation:toast-out .4s var(--ease) forwards }
  .toast b { font:700 13px Silkscreen,monospace; color:#d6267a; display:block }
  .toast i { position:absolute; left:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--pink),var(--lav)); animation:timer 9s linear forwards }
  @keyframes toast-in { from { opacity:0; transform:translateX(120%) rotate(6deg) } }
  @keyframes toast-out { to { opacity:0; transform:translateX(120%) } }
  @keyframes timer { from { width:100% } to { width:0 } }

  @media (max-width:760px) { .stats { grid-template-columns:1fr 1fr } }
  @media (max-width:640px) {
    .alert { grid-template-columns:1fr }
    header { min-height:140px; padding-right:70px } h1 { font-size:22px } .logo { width:48px; height:48px }
    .mascot img { width:54px } .bubble { display:none }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important } }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
                set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };

// ---------- pixel art del logo ----------
function pixels(rows, pal, cls) {
  let r = "";
  rows.forEach((line, y) => [...line].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  return `<svg class="${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`;
}
const LOGO = pixels([
  "....kkkk....",
  "..kkpppykk..",
  ".kpgppppppk.",
  ".kppkkkkpwk.",
  "kppkWWWWkppk",
  "kpykWeeWkpgk",
  "kppkWeeWkppk",
  "kwpkWWWWkpyk",
  ".kppkkkkppk.",
  ".kdppgpppdk.",
  "..kkddddkk..",
  "....kkkk....",
], { k:"#1b1325", p:"#ff5fa2", y:"#fde047", g:"#5eead4", w:"#ffffff", W:"#f1ecfa", e:"#1b1325", d:"#e8a65a" }, "logo");
$("logo").innerHTML = LOGO;
$("favicon").href = "data:image/svg+xml," + encodeURIComponent(LOGO);

// ---------- corazoncitos de fondo ----------
const glyphs = ["♡", "♥", "✦", "✧", "♡"];
setInterval(() => {
  if (document.hidden || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const f = document.createElement("span");
  f.className = "floaty"; f.textContent = glyphs[Math.random() * glyphs.length | 0];
  f.style.left = Math.random() * 100 + "vw"; f.style.bottom = "-20px";
  f.style.fontSize = 10 + Math.random() * 14 + "px"; f.style.animationDuration = 9 + Math.random() * 8 + "s";
  f.style.color = Math.random() < .5 ? "var(--pink)" : "var(--lav)";
  document.body.appendChild(f); setTimeout(() => f.remove(), 18000);
}, 1400);

// ---------- utilidades de animación ----------
function fold(id) { $(id).classList.toggle("open"); store.set(id, $(id).classList.contains("open") ? "1" : ""); }
["fDebug", "fAdmin"].forEach(id => store.get(id) && $(id).classList.add("open"));

function countTo(el, value) {               // números que suben/bajan suavemente
  const from = Number(el.dataset.v || 0), to = Number(value); el.dataset.v = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setText(el, txt, popClass) {
  if (el.textContent === txt) return;
  el.textContent = txt;
  if (popClass) { el.classList.remove(popClass); void el.offsetWidth; el.classList.add(popClass); }
}
function jump() { const m = $("femboy"); m.classList.remove("jump"); void m.offsetWidth; m.classList.add("jump"); }
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t | 0);
  return s < 60 ? `hace ${s}s` : s < 3600 ? `hace ${s / 60 | 0} min` : new Date(t * 1000).toLocaleTimeString(); };

// Lista con clave: solo crea lo nuevo (con animación de entrada) y anima la salida de lo que se va
function sync(box, list, key, make, update, emptyHTML) {
  if (!list.length) list = [{ __empty: true }];
  const old = new Map([...box.children].filter(el => el.dataset.k && !el.classList.contains("leave")).map(el => [el.dataset.k, el]));
  let prev = null;
  list.forEach((it, i) => {
    const k = it.__empty ? "__empty" : key(it);
    let el = old.get(k);
    if (!el) {
      el = it.__empty ? Object.assign(document.createElement("div"), { className: "empty", innerHTML: emptyHTML }) : make(it);
      el.dataset.k = k; el.classList.add("enter"); el.style.animationDelay = Math.min(i, 6) * 60 + "ms";
    }
    if (!it.__empty && update) update(el, it);
    old.delete(k);
    const ref = prev ? prev.nextSibling : box.firstChild;
    if (el !== ref) box.insertBefore(el, ref);
    prev = el;
  });
  old.forEach(el => { el.classList.add("leave"); setTimeout(() => el.remove(), 300); });
}
const html = s => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstChild; };
const chips = list => `<div class="chips">${list.map((i, n) => `<span class="chip" style="animation-delay:${200 + n * 90}ms">${esc(i.name)}${i.count ? " x" + esc(i.count) : ""} ${i.votes ? `<small>· ${esc(i.votes)} IAs</small>` : ""}</span>`).join("")}</div>`;
const fmt = list => list.map(i => esc(i.name) + (i.count ? " x" + esc(i.count) : "")).join(", ");

// ---------- avisos: sonido, notificación del navegador y tarjeta emergente ----------
let bell = store.get("bell") === "1", audio = null;
function paintBell() { $("bell").classList.toggle("on", bell); $("bell").textContent = bell ? "🔔 avisos: on" : "🔕 avisos: off"; }
async function toggleBell() {
  bell = !bell; store.set("bell", bell ? "1" : ""); paintBell();
  if (bell) {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume();
    if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
    ding();
  }
}
function ding() {
  if (!bell || !audio) return;
  [880, 1175, 1568].forEach((f, n) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + n * .09;
    o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.start(t); o.stop(t + .3);
  });
}
function toast(a) {
  const el = html(`<div class="toast"><b>💎 ${esc(a.streamer)} lleva loot</b>${fmt(a.items)}<i></i></div>`);
  el.onclick = () => window.open(a.url, "_blank", "noopener");
  $("toasts").prepend(el);
  setTimeout(() => { el.classList.add("bye"); setTimeout(() => el.remove(), 400); }, 9000);
  ding(); jump();
  if (bell && "Notification" in window && Notification.permission === "granted" && document.hidden) {
    const n = new Notification(`💎 ${a.streamer} lleva loot`, { body: a.items.map(i => i.name).join(", "), icon: $("favicon").href });
    n.onclick = () => { window.open(a.url, "_blank", "noopener"); n.close(); };
  }
}
function testToast() { toast({ streamer: "prueba", url: location.href, items: [{ name: "Elytra", count: 1 }] }); }
paintBell();
if (bell) document.addEventListener("pointerdown", () => { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); }, { once: true });

// ---------- API ----------
let pw = store.get("pw") || "";
$("pw").value = pw;
$("pw").oninput = e => { pw = e.target.value; store.set("pw", pw); };
let itemsLoaded = false, knownAlerts = null;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Password": pw }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}
const say = t => setText($("msg"), t);

// ---------- pintar ----------
function makeStream(st) {
  const el = html(`<div class="card">
    <div class="shot"><img class="f a"><img class="f b"><div class="scan"></div><div class="off"><b>zzz</b>offline</div><span class="badge"></span></div>
    <div class="body"><div class="row"><a class="name" target="_blank" rel="noopener"></a><span class="st"></span></div>
    <div class="row"><div class="items it"></div><button class="x">quitar</button></div></div></div>`);
  el.querySelector(".x").onclick = () => delS(st.id);
  return el;
}
function updateStream(el, st) {
  const on = st.status === "en directo", name = el.querySelector(".name");
  name.href = st.url; setText(name, st.name);
  el.querySelector(".badge").innerHTML = on ? `<span class="pill live">EN VIVO</span>` : "";
  const pill = el.querySelector(".st");
  pill.className = "st " + (on ? "" : "pill" + (/error|falta|límite|saturad/.test(st.status) ? " err" : ""));
  setText(pill, on ? "" : st.status);
  setText(el.querySelector(".it"), st.last_items.length ? "Lleva: " + st.last_items.map(i => i.name + (i.count ? " x" + i.count : "")).join(", ") : "Nada valioso visto");
  el.querySelector(".off").style.display = st.has_frame ? "none" : "";
  if (!st.has_frame) { el.querySelectorAll(".f").forEach(i => i.classList.remove("show")); return; }
  // fundido entre fotogramas: carga el nuevo en la imagen oculta y cuando está listo cambia
  const [a, b] = el.querySelectorAll(".f"), front = a.classList.contains("show") ? a : b, back = front === a ? b : a;
  if (back.dataset.loading) return;
  back.dataset.loading = 1;
  back.onload = () => { delete back.dataset.loading; back.classList.add("show"); front.classList.remove("show"); };
  back.onerror = () => delete back.dataset.loading;
  back.src = `/api/frame/${st.id}?t=${Date.now()}`;
}
function makeAlert(a) {
  return html(`<div class="card alert${knownAlerts ? " fresh" : ""}">
      <a href="/api/alert/${a.id}" target="_blank"><img src="/api/alert/${a.id}" alt="captura" loading="lazy"></a>
      <div><div class="row"><a class="name" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.streamer)}</a>
      <span class="ago" data-t="${a.time}">${ago(a.time)}</span></div>
      ${chips(a.items)}<div class="items">${a.items.map(i => esc(i.seen || "")).filter(Boolean).join(" · ")}</div>
      <div class="items">Detectado por ${esc(a.reason)}</div>
      <div class="btn-row"><button class="btn" onclick="window.open('${esc(a.url)}','_blank','noopener')">Abrir directo ↗</button></div></div></div>`);
}
function makeDebug(d) {
  const votes = (d.votes || []).map(v => v.error ? `<span class="err">✗ ${esc(v.model)}: ${esc(v.error)}</span>`
      : `<span class="${v.items.length ? "yes" : ""}">${v.items.length ? "✓" : "·"} ${esc(v.model)}: ${v.items.map(esc).join(", ") || "nada"}</span>`).join("");
  return html(`<div class="card body">
      <a href="/api/debug/${d.id}" target="_blank"><img src="/api/debug/${d.id}" alt="recorte" style="width:100%;height:150px;object-fit:cover;object-position:bottom;border-radius:10px" loading="lazy"></a>
      <div class="row"><span class="items">${esc(d.where)}</span><span class="ago" data-t="${d.time}">${ago(d.time)}</span></div>
      <div class="items">Casillas: ${(d.slots || []).map(esc).join(" · ") || "—"}</div>
      <div class="vote">${votes}</div>
      <p style="margin:10px 0 0"><b style="color:var(--amber)">Cuenta como: ${d.kept.map(esc).join(", ") || "nada"}</b></p></div>`);
}

async function refresh() {
  let s; try { s = await api("GET", "/api/state"); } catch (e) { setText($("bubble"), "sin conexión :(", "pop"); return; }
  const live = s.streamers.filter(st => st.status === "en directo").length;
  const today = new Date().toDateString();
  const fresh = s.alerts[0] && Date.now() / 1000 - s.alerts[0].time < 300;
  setText($("bubble"), fresh ? "¡¡LOOT!! corre 💎" : live ? `vigilando ${live} directo${live > 1 ? "s" : ""} 👀` : s.streamers.length ? "zzz... nadie en directo" : "añade un directo uwu", "pop");
  setText($("ver"), s.version || "");
  setText($("sLive"), `${live}/${s.streamers.length}`);
  countTo($("sAlerts"), s.alerts.filter(a => new Date(a.time * 1000).toDateString() === today).length);
  countTo($("sModels"), (s.models || []).length);
  $("dots").innerHTML = (s.models || []).map(m => `<i class="ok" title="${esc(m)}"></i>`).join("");
  countTo($("use"), s.usage); setText($("lim"), String(s.limit));
  $("useBar").style.width = Math.min(100, s.usage / s.limit * 100) + "%";
  ["cStreams", "cAlerts", "cDebug"].forEach((id, n) => setText($(id), String([s.streamers, s.alerts, s.debug || []][n].length)));
  const miss = [!s.ready.gemini && "GEMINI_API_KEY", !s.ready.discord && "DISCORD_WEBHOOK", !s.ready.password && "ADMIN_PASSWORD"].filter(Boolean);
  const w = miss.length ? `Falta configurar en Render: ${miss.join(", ")}` : "";
  if ($("warn").textContent !== w) $("warn").innerHTML = w ? `<div class="warn">${w}</div>` : "";
  if (!itemsLoaded) { $("items").value = s.items.join("\n"); itemsLoaded = true; }

  sync($("streams"), s.streamers, st => st.id, makeStream, updateStream, "<b>( ˘ω˘ )</b>Aún no hay directos. Añádelos en el panel de admin.");
  sync($("alerts"), s.alerts, a => a.id, makeAlert, null, "<b>( •̀ ω •́ )</b>Sin alertas todavía.");
  sync($("debug"), s.debug || [], d => d.id, makeDebug, null, "<b>…</b>Todavía no ha consultado a la IA.");
  document.querySelectorAll(".ago").forEach(e => setText(e, ago(Number(e.dataset.t))));

  // efecto de escaneo en la tarjeta del directo cuando la IA acaba de revisarlo
  const lastScan = (s.debug || [])[0];
  if (lastScan && lastScan.id !== refresh.scan) {
    if (refresh.scan) document.querySelectorAll("#streams .scan").forEach(e => { e.classList.remove("go"); void e.offsetWidth; e.classList.add("go"); });
    refresh.scan = lastScan.id;
  }
  const ids = new Set(s.alerts.map(a => a.id));
  if (knownAlerts) s.alerts.filter(a => !knownAlerts.has(a.id)).reverse().forEach(toast);
  knownAlerts = ids;
}
async function addS() { try { await api("POST", "/api/streamers", { url: $("url").value }); $("url").value = ""; say("Añadido ♡"); refresh(); } catch (e) { say(e.message); } }
async function delS(id) { try { await api("DELETE", "/api/streamers/" + id); refresh(); } catch (e) { say(e.message); } }
async function saveItems() { try { await api("PUT", "/api/items", { items: $("items").value.split("\n") }); say("Objetos guardados ♡"); } catch (e) { say(e.message); } }
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
