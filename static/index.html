<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía DonutSMP</title>
<link rel="icon" id="favicon">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0b14; --card:#191523; --card2:#211b2e; --line:#2f2840; --text:#f1ecfa; --muted:#9d94b3;
          --pink:#ff5fa2; --pink2:#ff8fc7; --green:#4ade80; --red:#f87171; --amber:#fbbf24; --cyan:#5eead4; }
  * { box-sizing:border-box }
  body { margin:0; color:var(--text); font:15px/1.5 Inter,system-ui,sans-serif;
         background:radial-gradient(900px 500px at 85% -10%, #ff5fa22a, transparent 60%),
                    radial-gradient(700px 400px at -10% 30%, #5eead414, transparent 60%), var(--bg); background-attachment:fixed }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
                 background-image:linear-gradient(#ffffff06 1px, transparent 1px), linear-gradient(90deg, #ffffff06 1px, transparent 1px);
                 background-size:24px 24px }
  .wrap { position:relative; max-width:1100px; margin:0 auto; padding:20px 16px 60px }
  h1,h2,summary,.pix { font-family:Silkscreen,monospace }

  header { display:flex; align-items:center; gap:14px; padding:14px 0 6px; position:relative; min-height:178px }
  .logo { width:64px; height:64px; image-rendering:pixelated; filter:drop-shadow(0 4px 0 #0006); flex:none }
  h1 { font-size:30px; line-height:1; margin:0; color:var(--pink); text-shadow:3px 3px 0 #5a1f3d }
  h1 span { color:var(--text); text-shadow:3px 3px 0 #2a2238 }
  .tag { color:var(--muted); font-size:13px; margin-top:6px; display:flex; gap:8px; align-items:center }
  .ver { font-family:Silkscreen,monospace; font-size:11px; background:var(--line); padding:1px 7px; border-radius:4px }

  .mascot { position:absolute; right:0; top:4px; display:flex; align-items:flex-start; gap:6px }
  .mascot img { width:70px; height:auto; image-rendering:pixelated; animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 0 2px #ff8fc7aa) drop-shadow(0 6px 0 #0005) }
  .bubble { margin-top:18px; background:var(--text); color:#1b1325; font:700 12px Silkscreen,monospace; padding:8px 10px;
            border-radius:4px; position:relative; max-width:150px; box-shadow:3px 3px 0 var(--pink) }
  .bubble::after { content:""; position:absolute; right:-8px; top:12px; border:5px solid transparent; border-left:8px solid var(--text) }
  @keyframes bob { 50% { transform:translateY(-5px) } }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px }
  .stat { background:var(--card); border:2px solid var(--line); border-radius:6px; padding:12px 14px; box-shadow:0 4px 0 #0005 }
  .stat .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em }
  .stat .v { font:800 26px Inter,sans-serif; margin-top:2px }
  .bar { height:8px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:6px }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--pink),var(--pink2)) }

  .warn { background:#3b2a0b; border:2px solid var(--amber); color:var(--amber); padding:10px 14px; border-radius:6px; margin-top:16px; font-size:14px }
  h2 { font-size:15px; margin:34px 0 12px; color:var(--pink2); display:flex; align-items:center; gap:10px }
  h2::after { content:""; flex:1; height:2px; background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px) }

  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)) }
  .one { grid-template-columns:1fr }
  .card { background:var(--card); border:2px solid var(--line); border-radius:6px; overflow:hidden; box-shadow:0 5px 0 #0006; transition:transform .15s, border-color .15s }
  .card:hover { transform:translateY(-2px); border-color:#463c5e }
  .shot { aspect-ratio:16/9; background:#07050b; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:Silkscreen,monospace; position:relative }
  .shot img { width:100%; height:100%; object-fit:cover; display:block }
  .shot .live { position:absolute; top:8px; left:8px }
  .body { padding:12px 14px }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
  .name { font-weight:800; color:var(--text); text-decoration:none } .name:hover { color:var(--pink2) }
  .pill { font-size:12px; padding:2px 8px; border-radius:4px; background:var(--line); color:var(--muted); white-space:nowrap }
  .pill.live { background:#e11d48; color:#fff; font-family:Silkscreen,monospace; display:inline-flex; align-items:center; gap:5px }
  .pill.live::before { content:""; width:7px; height:7px; background:#fff; border-radius:50%; animation:blink 1.2s infinite }
  .pill.ok { background:#123d24; color:var(--green) } .pill.err { background:#3d1515; color:var(--red) }
  @keyframes blink { 50% { opacity:.2 } }
  .items { font-size:13px; color:var(--muted); margin-top:6px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
  .chip { background:#3a2c0a; color:var(--amber); border:1px solid #6b5212; font-weight:800; font-size:13px; padding:3px 9px; border-radius:4px }
  .x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px } .x:hover { color:var(--red) }
  .alert { display:grid; grid-template-columns:220px 1fr; gap:14px; padding:12px; border-left:6px solid var(--red) }
  .alert.new { animation:glow 1.6s ease-in-out 3; }
  @keyframes glow { 50% { box-shadow:0 0 0 3px #ff5fa288, 0 5px 0 #0006 } }
  .alert img { width:100%; border-radius:4px; display:block; cursor:zoom-in }
  @media (max-width:640px) {
    .alert { grid-template-columns:1fr } .stats { grid-template-columns:1fr }
    header { min-height:120px; padding-right:90px } h1 { font-size:22px } .logo { width:48px; height:48px }
    .mascot img { width:52px } .bubble { display:none }
  }
  details { margin-top:30px; background:var(--card); border:2px solid var(--line); border-radius:6px; padding:12px 14px }
  summary { cursor:pointer; color:var(--pink2) }
  .admin { display:grid; gap:12px; margin-top:12px }
  input, textarea { width:100%; background:var(--bg); color:var(--text); border:2px solid var(--line); border-radius:4px; padding:10px; font:inherit }
  input:focus, textarea:focus { outline:none; border-color:var(--pink) }
  button.btn { background:var(--pink); color:#1b1325; border:0; border-radius:4px; padding:10px 16px; font:700 13px Silkscreen,monospace; cursor:pointer; box-shadow:0 4px 0 #a3255f; white-space:nowrap }
  button.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #a3255f }
  .msg { font-size:13px; color:var(--muted); min-height:1.2em }
  .empty { color:var(--muted); padding:22px; text-align:center; background:var(--card); border:2px dashed var(--line); border-radius:6px }
</style>
</head>

  </details>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Pixel art: cada letra es un color, "." es transparente
function pixels(rows, pal, cls) {
  let r = "";
  rows.forEach((line, y) => [...line].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  return `<svg class="${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`;
}
const LOGO = pixels([
  "....kkkk....",
  "..kkpppykk..",
  ".kpgppppppk.",
  ".kppkkkkpwk.",
  "kppkWWWWkppk",
  "kpykWeeWkpgk",
  "kppkWeeWkppk",
  "kwpkWWWWkpyk",
  ".kppkkkkppk.",
  ".kdppgpppdk.",
  "..kkddddkk..",
  "....kkkk....",
], { k:"#1b1325", p:"#ff5fa2", y:"#fde047", g:"#5eead4", w:"#ffffff", W:"#f1ecfa", e:"#1b1325", d:"#e8a65a" }, "logo");

$("logo").innerHTML = LOGO;
$("favicon").href = "data:image/svg+xml," + encodeURIComponent(LOGO);

let pw = ""; try { pw = localStorage.getItem("pw") || ""; } catch (e) {}
$("pw").value = pw;
$("pw").oninput = e => { pw = e.target.value; try { localStorage.setItem("pw", pw); } catch (e) {} };
let itemsLoaded = false, seenAlert = null;
const chips = list => `<div class="chips">${list.map(i => `<span class="chip">${esc(i.name)}${i.count ? " x" + esc(i.count) : ""}</span>`).join("")}</div>`;
const fmt = list => list.map(i => esc(i.name) + (i.count ? " x" + esc(i.count) : "")).join(", ");

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Password": pw }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}
const say = t => $("msg").textContent = t;

async function refresh() {
  let s; try { s = await api("GET", "/api/state"); } catch (e) { $("bubble").textContent = "sin conexión :("; return; }
  const live = s.streamers.filter(st => st.status === "en directo").length;
  const today = new Date().toDateString();
  const alertsToday = s.alerts.filter(a => new Date(a.time * 1000).toDateString() === today).length;
  const fresh = s.alerts[0] && Date.now() / 1000 - s.alerts[0].time < 300;
  $("bubble").textContent = fresh ? "¡¡LOOT!! corre 💎" : live ? `vigilando ${live} directo${live > 1 ? "s" : ""} 👀` : s.streamers.length ? "zzz... nadie en directo" : "añade un directo uwu";
  $("ver").textContent = s.version || "";
  $("sLive").textContent = `${live}/${s.streamers.length}`;
  $("sAlerts").textContent = alertsToday;
  $("use").textContent = s.usage; $("lim").textContent = s.limit;
  $("useBar").style.width = Math.min(100, s.usage / s.limit * 100) + "%";
  const miss = [!s.ready.gemini && "GEMINI_API_KEY", !s.ready.discord && "DISCORD_WEBHOOK", !s.ready.password && "ADMIN_PASSWORD"].filter(Boolean);
  $("warn").innerHTML = miss.length ? `<div class="warn">Falta configurar en Render: ${miss.join(", ")}</div>` : "";
  if (!itemsLoaded) { $("items").value = s.items.join("\n"); itemsLoaded = true; }

  const t = Date.now();
  $("streams").innerHTML = s.streamers.length ? s.streamers.map(st => {
    const on = st.status === "en directo";
    const cls = /error|falta|límite/.test(st.status) ? "err" : "";
    return `<div class="card"><div class="shot">${st.has_frame ? `<img src="/api/frame/${st.id}?t=${t}" alt="">` : "OFFLINE zzz"}
        ${on ? `<span class="pill live">EN VIVO</span>` : ""}</div>
      <div class="body"><div class="row"><a class="name" href="${esc(st.url)}" target="_blank" rel="noopener">${esc(st.name)}</a>
      ${on ? "" : `<span class="pill ${cls}">${esc(st.status)}</span>`}</div>
      <div class="row"><div class="items">${st.last_items.length ? "Lleva: " + fmt(st.last_items) : "Nada valioso visto"}</div>
      <button class="x" onclick="delS('${st.id}')">quitar</button></div></div></div>`;
  }).join("") : `<div class="empty">Aún no hay directos. Añádelos en el panel de admin.</div>`;

  const newest = s.alerts[0] && s.alerts[0].id;
  $("alerts").innerHTML = s.alerts.length ? s.alerts.map((a, n) => `<div class="card alert${n === 0 && seenAlert && newest !== seenAlert ? " new" : ""}">
      <a href="/api/alert/${a.id}" target="_blank"><img src="/api/alert/${a.id}" alt="captura"></a>
      <div><div class="row"><a class="name" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.streamer)}</a>
      <span class="pill">${new Date(a.time * 1000).toLocaleTimeString()}</span></div>
      ${chips(a.items)}<div class="items">${a.items.map(i => esc(i.seen || "")).filter(Boolean).join(" · ")}</div>
      <div class="items">Detectado por ${esc(a.reason)}</div></div></div>`).join("")
    : `<div class="empty">Sin alertas todavía.</div>`;
  if (newest) seenAlert = newest;

  $("debug").innerHTML = (s.debug || []).map(d => `<div class="card body">
      <a href="/api/debug/${d.id}" target="_blank"><img src="/api/debug/${d.id}" alt="recorte" style="width:100%;border-radius:4px"></a>
      <div class="row"><span class="items">${esc(d.where)}</span><span class="pill">${new Date(d.time * 1000).toLocaleTimeString()}</span></div>
      <div class="items">Casillas: ${d.slots.map(esc).join(" · ") || "—"}</div>
      <div class="items">IA dijo: ${d.raw.map(i => esc(i.name) + " (" + esc(i.confidence) + ") " + esc(i.seen || "")).join(" · ") || "nada"}</div>
      <p><b>Cuenta como: ${d.kept.map(esc).join(", ") || "nada"}</b></p></div>`).join("") || `<div class="empty">Todavía no ha consultado a la IA.</div>`;
}
async function addS() { try { await api("POST", "/api/streamers", { url: $("url").value }); $("url").value = ""; say("Añadido."); refresh(); } catch (e) { say(e.message); } }
async function delS(id) { try { await api("DELETE", "/api/streamers/" + id); refresh(); } catch (e) { say(e.message); } }
async function saveItems() { try { await api("PUT", "/api/items", { items: $("items").value.split("\n") }); say("Objetos guardados."); } catch (e) { say(e.message); } }
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
