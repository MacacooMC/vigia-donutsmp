<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía DonutSMP</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f0d14; --card:#1a1722; --line:#2c2838; --text:#ece8f5; --muted:#9a93ad;
          --pink:#ff5fa2; --green:#4ade80; --red:#f87171; --amber:#fbbf24; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,system-ui,sans-serif }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px }
  h1,h2 { font-family:Silkscreen,monospace; font-weight:700; margin:0 }
  h1 { font-size:28px; color:var(--pink) } h1 span { color:var(--text) }
  h2 { font-size:16px; margin:32px 0 12px; color:var(--muted) }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between }
  .meter { font-size:13px; color:var(--muted) } .bar { width:180px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:4px }
  .bar i { display:block; height:100%; background:var(--pink) }
  .warn { background:#3b2a0b; border:1px solid var(--amber); color:var(--amber); padding:10px 14px; border-radius:8px; margin-top:16px; font-size:14px }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden }
  .shot { aspect-ratio:16/9; background:#000 center/cover; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:Silkscreen,monospace }
  .shot img { width:100%; height:100%; object-fit:cover; display:block }
  .body { padding:12px 14px }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px }
  .name { font-weight:600; color:var(--text); text-decoration:none }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--muted); white-space:nowrap }
  .pill.live { background:#123d24; color:var(--green) } .pill.err { background:#3d1515; color:var(--red) }
  .items { font-size:13px; color:var(--muted); margin-top:6px }
  .x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px } .x:hover { color:var(--red) }
  .alert { display:grid; grid-template-columns:200px 1fr; gap:14px; padding:12px; border-left:3px solid var(--red) }
  .alert img { width:100%; border-radius:6px; display:block; cursor:zoom-in }
  .alert b { color:var(--amber) }
  @media (max-width:560px) { .alert { grid-template-columns:1fr } }
  details { margin-top:36px } summary { cursor:pointer; color:var(--muted); font-family:Silkscreen,monospace }
  .admin { display:grid; gap:12px; margin-top:12px }
  input, textarea { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit }
  button.btn { background:var(--pink); color:#111; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer }
  .msg { font-size:13px; color:var(--muted); min-height:1.2em }
  .empty { color:var(--muted); padding:20px; text-align:center; background:var(--card); border-radius:10px }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>VIGÍA <span>DONUTSMP</span> <small id="ver" style="font-size:12px;color:var(--muted)"></small></h1>
    <div class="meter">Consultas IA hoy: <span id="use">0</span> / <span id="lim">0</span><div class="bar"><i id="useBar" style="width:0"></i></div></div>
  </header>
  <div id="warn"></div>

  <h2>Directos vigilados</h2>
  <div class="grid" id="streams"></div>

  <h2>Últimas alertas</h2>
  <div id="alerts" class="grid" style="grid-template-columns:1fr"></div>

  <details>
    <summary>Lo que ve la IA (últimas 20 consultas)</summary>
    <p class="items">Si salta un falso aviso, haz captura de esta sección y pásala.</p>
    <div id="debug" class="grid" style="grid-template-columns:1fr"></div>
  </details>

  <details>
    <summary>Panel de admin</summary>
    <div class="admin">
      <input id="pw" type="password" placeholder="Contraseña de admin">
      <div class="row"><input id="url" placeholder="Link del directo (Twitch, Kick, YouTube) o nombre de Twitch"><button class="btn" onclick="addS()">Añadir</button></div>
      <label class="meter">Objetos valiosos (uno por línea)</label>
      <textarea id="items" rows="7"></textarea>
      <div><button class="btn" onclick="saveItems()">Guardar objetos</button></div>
      <div class="msg" id="msg"></div>
    </div>
  </details>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pw = ""; try { pw = localStorage.getItem("pw") || ""; } catch (e) {}
$("pw").value = pw;
$("pw").oninput = e => { pw = e.target.value; try { localStorage.setItem("pw", pw); } catch (e) {} };
let itemsLoaded = false;
const fmt = list => list.map(i => esc(i.name) + (i.count ? " x" + esc(i.count) : "")).join(", ");

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Password": pw }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}
const say = t => $("msg").textContent = t;

async function refresh() {
  let s; try { s = await api("GET", "/api/state"); } catch (e) { return; }
  $("ver").textContent = s.version || "";
  $("debug").innerHTML = (s.debug || []).map(d => `<div class="card body">
      <a href="/api/debug/${d.id}" target="_blank"><img src="/api/debug/${d.id}" alt="recorte" style="width:100%;border-radius:6px"></a>
      <div class="row"><span class="items">${esc(d.where)}</span><span class="pill">${new Date(d.time * 1000).toLocaleTimeString()}</span></div>
      <div class="items">Casillas: ${d.slots.map(esc).join(" · ") || "—"}</div>
      <div class="items">IA dijo: ${d.raw.map(i => esc(i.name) + " (" + esc(i.confidence) + ") " + esc(i.seen || "")).join(" · ") || "nada"}</div>
      <p><b>Cuenta como: ${d.kept.map(esc).join(", ") || "nada"}</b></p></div>`).join("") || `<div class="empty">Todavía no ha consultado a la IA.</div>`;
  $("use").textContent = s.usage; $("lim").textContent = s.limit;
  $("useBar").style.width = Math.min(100, s.usage / s.limit * 100) + "%";
  const miss = [!s.ready.gemini && "GEMINI_API_KEY", !s.ready.discord && "DISCORD_WEBHOOK", !s.ready.password && "ADMIN_PASSWORD"].filter(Boolean);
  $("warn").innerHTML = miss.length ? `<div class="warn">Falta configurar en el Space: ${miss.join(", ")}</div>` : "";
  if (!itemsLoaded) { $("items").value = s.items.join("\n"); itemsLoaded = true; }
  const t = Date.now();
  $("streams").innerHTML = s.streamers.length ? s.streamers.map(st => {
    const cls = st.status === "en directo" ? "live" : /error|falta|límite/.test(st.status) ? "err" : "";
    return `<div class="card"><div class="shot">${st.has_frame ? `<img src="/api/frame/${st.id}?t=${t}" alt="">` : "OFFLINE"}</div>
      <div class="body"><div class="row"><a class="name" href="${esc(st.url)}" target="_blank" rel="noopener">${esc(st.name)}</a>
      <span class="pill ${cls}">${esc(st.status)}</span></div>
      <div class="row"><div class="items">${st.last_items.length ? "Lleva: " + fmt(st.last_items) : "Nada valioso visto"}</div>
      <button class="x" onclick="delS('${st.id}')">quitar</button></div></div></div>`;
  }).join("") : `<div class="empty">Aún no hay directos. Añádelos en el panel de admin.</div>`;
  $("alerts").innerHTML = s.alerts.length ? s.alerts.map(a => `<div class="card alert">
      <a href="/api/alert/${a.id}" target="_blank"><img src="/api/alert/${a.id}" alt="captura"></a>
      <div><div class="row"><a class="name" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.streamer)}</a>
      <span class="pill">${new Date(a.time * 1000).toLocaleTimeString()}</span></div>
      <p><b>${fmt(a.items)}</b></p><div class="items">${a.items.map(i => esc(i.seen || "")).filter(Boolean).join(" · ")}</div><div class="items">Detectado por ${esc(a.reason)}</div></div></div>`).join("")
    : `<div class="empty">Sin alertas todavía.</div>`;
}
async function addS() { try { await api("POST", "/api/streamers", { url: $("url").value }); $("url").value = ""; say("Añadido."); refresh(); } catch (e) { say(e.message); } }
async function delS(id) { try { await api("DELETE", "/api/streamers/" + id); refresh(); } catch (e) { say(e.message); } }
async function saveItems() { try { await api("PUT", "/api/items", { items: $("items").value.split("\n") }); say("Objetos guardados."); } catch (e) { say(e.message); } }
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
